name: 임시 - 기술특례 상장 직전 실적
on:
  push:
    branches: [tmp-fincheck]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install -r scripts/requirements.txt
      - env: { DART_API_KEY: "${{ secrets.DART_API_KEY }}" }
        run: python -u tmpcheck/fincheck.py
        timeout-minutes: 25
      - if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmpcheck/result.json && git commit -m "result" && git push origin HEAD:tmp-fincheck || true
