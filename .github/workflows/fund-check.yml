# 공모자금 사용 목적 원문 대조(일회성 점검) — scripts/fund_check.py 를 고쳐 올리면 실행됨
name: 자금 사용 목적 원문 대조

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fund_check.py
      - .github/workflows/fund-check.yml

permissions:
  contents: write

concurrency:
  group: fund-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: 원문 읽기
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/fund_check.py
      - name: 결과 저장
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debug/fund_check.json
          git diff --cached --quiet && exit 0
          git commit -m "자금 사용 목적 원문 대조 결과"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && break; sleep 20; done
